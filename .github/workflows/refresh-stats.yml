name: Auto-Refresh Activity Stats Cache

on:
  schedule:
    # Runs every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allows manual one-click refresh from Actions tab

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Cache Buster in README.md
        run: |
          python3 -c "
          import re, time
          with open('README.md', 'r') as f:
              content = f.read()
          new_v = str(int(time.time()))
          updated = re.sub(r'(&(?:amp;)?v=)\w+', r'\g<1>' + new_v, content)
          with open('README.md', 'w') as f:
              f.write(updated)
          "

      - name: Commit and Push if Changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore(stats): auto-refresh live activity cache [skip ci]"
            git push
          fi
