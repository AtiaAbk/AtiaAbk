<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 184" width="1000" height="184" role="img">
  <title>Atia Sanjida (Oishi) - GitHub Profile Banner</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#140d24"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"><animate attributeName="stop-color" values="#58a6ff;#bc8cff;#39d353;#58a6ff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#bc8cff"><animate attributeName="stop-color" values="#bc8cff;#39d353;#58a6ff;#bc8cff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#39d353"><animate attributeName="stop-color" values="#39d353;#58a6ff;#bc8cff;#39d353" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>

    <!-- flowing name gradient -->
    <linearGradient id="nameFlow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="360" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="50%" stop-color="#d2a8ff"/>
      <stop offset="100%" stop-color="#56d364"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="720 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="sweepGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(64)">
      <stop offset="0" stop-color="#39d353" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0.28"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="184" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Menlo,Consolas,monospace; }
    .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    @keyframes role1 { 0%,22% {opacity:1;transform:translateY(0)} 25%,97% {opacity:0;transform:translateY(-8px)} 100% {opacity:1;transform:translateY(0)} }
    @keyframes role2 { 0%,23% {opacity:0;transform:translateY(8px)} 26%,47% {opacity:1;transform:translateY(0)} 50%,100% {opacity:0;transform:translateY(-8px)} }
    @keyframes role3 { 0%,48% {opacity:0;transform:translateY(8px)} 51%,72% {opacity:1;transform:translateY(0)} 75%,100% {opacity:0;transform:translateY(-8px)} }
    @keyframes role4 { 0%,73% {opacity:0;transform:translateY(8px)} 76%,97% {opacity:1;transform:translateY(0)} 100% {opacity:0;transform:translateY(-8px)} }
    .role-1 { animation: role1 12s infinite; }
    .role-2 { animation: role2 12s infinite; }
    .role-3 { animation: role3 12s infinite; }
    .role-4 { animation: role4 12s infinite; }
    .role-2,.role-3,.role-4 { opacity: 0; }
    /* progress pips */
    @keyframes pip1 { 0%,24% {opacity:1} 25%,97% {opacity:0} 100% {opacity:1} }
    @keyframes pip2 { 0%,24% {opacity:0} 26%,49% {opacity:1} 50%,100% {opacity:0} }
    @keyframes pip3 { 0%,49% {opacity:0} 51%,74% {opacity:1} 75%,100% {opacity:0} }
    @keyframes pip4 { 0%,74% {opacity:0} 76%,98% {opacity:1} 100% {opacity:0} }
    .pip-1 { animation: pip1 12s infinite; }
    .pip-2 { animation: pip2 12s infinite; opacity:0; }
    .pip-3 { animation: pip3 12s infinite; opacity:0; }
    .pip-4 { animation: pip4 12s infinite; opacity:0; }
    @keyframes blink { 50% { opacity: 0; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .pulse2 { animation: pulse 3.1s ease-in-out infinite -1s; }
    .pulse3 { animation: pulse 2.8s ease-in-out infinite -2s; }
  </style>

  <g clip-path="url(#card)">
    <!-- background -->
    <rect width="1000" height="184" fill="url(#bgGrad)"/>
    <rect width="1000" height="184" fill="url(#dotGrid)"/>

    <!-- threat radar (right) -->
    <g transform="translate(884,100)" opacity="0.9">
      <circle r="64" fill="none" stroke="#58a6ff" stroke-opacity="0.16"/>
      <circle r="42" fill="none" stroke="#58a6ff" stroke-opacity="0.16"/>
      <circle r="20" fill="none" stroke="#58a6ff" stroke-opacity="0.16"/>
      <line x1="-70" y1="0" x2="70" y2="0" stroke="#58a6ff" stroke-opacity="0.12"/>
      <line x1="0" y1="-70" x2="0" y2="70" stroke="#58a6ff" stroke-opacity="0.12"/>
      <g>
        <path d="M0 0 L64 0 A64 64 0 0 0 55.4 -32 Z" fill="url(#sweepGrad)"/>
        <line x1="0" y1="0" x2="64" y2="0" stroke="#39d353" stroke-opacity="0.8" stroke-width="1.4"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      </g>
      <circle cx="30" cy="-26" r="3" fill="#bc8cff" class="pulse"/>
      <circle cx="-34" cy="14" r="3" fill="#58a6ff" class="pulse2"/>
      <circle cx="12" cy="40" r="2.6" fill="#39d353" class="pulse3"/>
      <circle r="2.5" fill="#39d353"/>
    </g>

    <g transform="translate(722,16)">
      <rect width="258" height="22" rx="11" fill="#0d1117" stroke="#388bfd" stroke-width="1.2"/>
      <circle cx="14" cy="11" r="4.5" fill="#58a6ff"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="26" y="15" class="sans" font-size="10.5" font-weight="700" fill="#79c0ff" textLength="214" lengthAdjust="spacingAndGlyphs">B.SC. ICE • SYSTEMS &amp; SECURITY 🛡️</text>
    </g>

    <g transform="translate(0,-31)">
    <!-- avatar box -->
    <g transform="translate(48,66)">
      <rect width="112" height="112" rx="24" fill="#161b22" stroke="url(#borderGrad)" stroke-width="2"/>
      <circle cx="56" cy="56" r="44" fill="#0d1117"/>
      <path d="M42 46 L30 56 L42 66" fill="none" stroke="#58a6ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M70 46 L82 56 L70 66" fill="none" stroke="#bc8cff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="58" y1="44" x2="54" y2="68" stroke="#39d353" stroke-width="3.2" stroke-linecap="round"/>
    </g>

    <!-- name -->
    <g transform="translate(182,94)">
      <text x="0" y="0" class="mono" font-size="14" font-weight="600" fill="#79c0ff" letter-spacing="1">&gt; HI THERE, I'M<tspan class="cursor" fill="#39d353"> _</tspan></text>
      <text x="0" y="38" class="sans" font-size="34" font-weight="800" fill="url(#nameFlow)" letter-spacing="0.5">Atia Sanjida (Oishi)</text>
      <text x="365" y="36" font-size="28">👋</text>
    </g>

    <!-- cycling roles -->
    <g transform="translate(182,164)">
      <g class="role-1"><text class="mono" font-size="16.5" font-weight="600" fill="#e6edf3">🛡️ <tspan fill="#58a6ff">Security Researcher</tspan> • <tspan fill="#c9d1d9">Cybersecurity &amp; Ethical Hacking</tspan></text></g>
      <g class="role-2"><text class="mono" font-size="16.5" font-weight="600" fill="#e6edf3">💻 <tspan fill="#39d353">Currently Learning</tspan> • <tspan fill="#c9d1d9">Systems Engineering &amp; Computer Networks</tspan></text></g>
      <g class="role-3"><text class="mono" font-size="16.5" font-weight="600" fill="#e6edf3">🤖 <tspan fill="#bc8cff">Exploring</tspan> • <tspan fill="#c9d1d9">Python &amp; AI / ML</tspan></text></g>
      <g class="role-4"><text class="mono" font-size="16.5" font-weight="600" fill="#e6edf3">🎓 <tspan fill="#f0883e">B.Sc.</tspan> • <tspan fill="#c9d1d9">Information &amp; Communication Engineering</tspan></text></g>
    </g>

    <!-- role progress pips -->
    <g transform="translate(182,180)">
      <g fill="#30363d">
        <rect x="0" width="26" height="3" rx="1.5"/><rect x="32" width="26" height="3" rx="1.5"/>
        <rect x="64" width="26" height="3" rx="1.5"/><rect x="96" width="26" height="3" rx="1.5"/>
      </g>
      <rect class="pip-1" x="0" width="26" height="3" rx="1.5" fill="#58a6ff"/>
      <rect class="pip-2" x="32" width="26" height="3" rx="1.5" fill="#39d353"/>
      <rect class="pip-3" x="64" width="26" height="3" rx="1.5" fill="#bc8cff"/>
      <rect class="pip-4" x="96" width="26" height="3" rx="1.5" fill="#f0883e"/>
    </g>


    </g>

    <!-- bottom scanning laser -->
    <rect x="0" y="180" width="180" height="3" rx="1.5" fill="url(#laserGrad)">
      <animate attributeName="x" values="0;820;0" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="998" height="182" rx="17" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
</svg>
