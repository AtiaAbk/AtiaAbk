<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Atia Sanjida (Oishi) - B.Sc. Information and Communication Engineering">
<title>Atia Sanjida (Oishi)</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#121426"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fb9a8"/><stop offset=".5" stop-color="#5b8cff"/><stop offset="1" stop-color="#a97cff"/></linearGradient>
  <linearGradient id="nm" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#8ec5ff"/><stop offset=".5" stop-color="#b9a4ff"/><stop offset="1" stop-color="#8ec5ff"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="-0.5 0" to="0.5 0" dur="8s" repeatCount="indefinite"/></linearGradient>
  <linearGradient id="ul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a5c"/><stop offset="1" stop-color="#ff9a5c" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#5b8cff" stop-opacity=".22"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".06"/></pattern>
  <clipPath id="card"><rect width="1280" height="440" rx="26"/></clipPath>
</defs>
<style>
.mono{font-family:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace}
@keyframes role1{0%,22%{opacity:1;transform:translateY(0)}25%,97%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes role2{0%,23%{opacity:0;transform:translateY(8px)}26%,47%{opacity:1;transform:translateY(0)}50%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes role3{0%,48%{opacity:0;transform:translateY(8px)}51%,72%{opacity:1;transform:translateY(0)}75%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes role4{0%,73%{opacity:0;transform:translateY(8px)}76%,97%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-8px)}}
.r1{animation:role1 12s infinite}.r2{animation:role2 12s infinite;opacity:0}.r3{animation:role3 12s infinite;opacity:0}.r4{animation:role4 12s infinite;opacity:0}
@keyframes pip1{0%,24%{opacity:1}25%,97%{opacity:0}100%{opacity:1}}
@keyframes pip2{0%,24%{opacity:0}26%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pip3{0%,49%{opacity:0}51%,74%{opacity:1}75%,100%{opacity:0}}
@keyframes pip4{0%,74%{opacity:0}76%,98%{opacity:1}100%{opacity:0}}
.p1{animation:pip1 12s infinite}.p2{animation:pip2 12s infinite;opacity:0}.p3{animation:pip3 12s infinite;opacity:0}.p4{animation:pip4 12s infinite;opacity:0}
</style>
<g clip-path="url(#card)">
  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#dots)"/>
  <circle cx="260" cy="150" r="260" fill="url(#glow)"><animate attributeName="cx" values="260;420;260" dur="14s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="380" r="240" fill="url(#glow)" opacity=".7"><animate attributeName="cy" values="380;300;380" dur="12s" repeatCount="indefinite"/></circle>

  <!-- faint code mark -->
  <g fill="none" stroke="#5b8cff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(1020 100)" opacity=".1">
    <path d="M70 20L10 80L70 140"/><path d="M170 20L230 80L170 140"/><path d="M135 0L105 160" stroke="#a97cff"/>
    <animate attributeName="opacity" values=".07;.15;.07" dur="5s" repeatCount="indefinite"/></g>

  <!-- radar -->
  <g transform="translate(1150 345)" opacity=".75">
    <circle r="78" fill="none" stroke="#2c3550" stroke-width="1.5"/><circle r="50" fill="none" stroke="#2c3550"/><circle r="22" fill="none" stroke="#2c3550"/>
    <path d="M-78 0H78M0 -78V78" stroke="#2c3550"/>
    <g><path d="M0 0L78 0A78 78 0 0 0 55 -55Z" fill="#3fb9a8" fill-opacity=".18"/><line x1="0" y1="0" x2="78" y2="0" stroke="#3fb9a8" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/></g>
    <circle cx="-34" cy="-38" r="4" fill="#5b8cff"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="26" r="4" fill="#3fb9a8"><animate attributeName="opacity" values=".2;1;.2" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="10" cy="-52" r="3" fill="#a97cff"><animate attributeName="opacity" values=".2;1;.2" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- badge -->
  <g transform="translate(872 34)">
    <rect width="372" height="38" rx="19" fill="#0b0f17" fill-opacity=".8" stroke="#5b8cff" stroke-opacity=".7"/>
    <circle cx="22" cy="19" r="5" fill="#3fb9a8"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <path transform="translate(336 9) scale(1)" d="M10 0L19 3V10C19 15 15 19 10 21C5 19 1 15 1 10V3Z" fill="none" stroke="#8ec5ff" stroke-width="1.8" stroke-linejoin="round"/><text x="38" y="24.5" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="13.5" font-weight="700" fill="#8ec5ff" letter-spacing="1.2">B.SC. ICE  •  SYSTEMS &amp; SECURITY</text>
  </g>

  <!-- greeting -->
  <g font-family="'JetBrains Mono',Consolas,Menlo,monospace">
    <text x="76" y="118" font-size="24" font-weight="700" fill="#3fb9a8" letter-spacing="4">&gt; HI THERE, I'M<tspan fill="#8ec5ff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/> _</tspan></text>
  </g>

  <!-- name -->
  <text x="72" y="228" font-family="'Segoe UI','Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="92" font-weight="800" fill="url(#nm)" letter-spacing="-1">Atia Sanjida (Oishi)
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/></text>
  <g transform="translate(930 138)" fill="#ffcf6e">
    <g><path d="M10 40 C4 30 10 22 18 28 L26 38 L20 12 C19 4 30 3 31 10 L35 30 L38 4 C39 -3 50 -2 49 6 L47 30 L56 10 C59 3 69 7 66 14 L55 42 C62 38 70 40 66 48 C58 70 44 82 28 74 C16 68 12 52 10 40Z"/>
    <animateTransform attributeName="transform" type="rotate" values="0 38 70;16 38 70;-6 38 70;12 38 70;0 38 70" dur="2.4s" repeatCount="indefinite"/></g></g>

  <!-- cycling roles -->
  <g class="mono" font-size="24" font-weight="600" transform="translate(76 290)">
    <g class="r1"><circle cx="-0" cy="-8" r="0"/><text fill="#5b8cff">Security Researcher<tspan fill="#5b6478" dx="12">•</tspan><tspan fill="#e6edf3" dx="12">Cybersecurity &amp; Ethical Hacking</tspan></text></g>
    <g class="r2"><text fill="#3fb9a8">Currently Learning<tspan fill="#5b6478" dx="12">•</tspan><tspan fill="#e6edf3" dx="12">Systems Engineering &amp; Computer Networks</tspan></text></g>
    <g class="r3"><text fill="#a97cff">Exploring<tspan fill="#5b6478" dx="12">•</tspan><tspan fill="#e6edf3" dx="12">Python &amp; AI / ML</tspan></text></g>
    <g class="r4"><text fill="#ff9a5c">B.Sc.<tspan fill="#5b6478" dx="12">•</tspan><tspan fill="#e6edf3" dx="12">Information &amp; Communication Engineering</tspan></text></g>
  </g>

  <!-- role pips -->
  <g transform="translate(76 322)">
    <g fill="#232a3d"><rect width="46" height="4" rx="2"/><rect x="54" width="46" height="4" rx="2"/><rect x="108" width="46" height="4" rx="2"/><rect x="162" width="46" height="4" rx="2"/></g>
    <rect class="p1" width="46" height="4" rx="2" fill="#5b8cff"/><rect class="p2" x="54" width="46" height="4" rx="2" fill="#3fb9a8"/>
    <rect class="p3" x="108" width="46" height="4" rx="2" fill="#a97cff"/><rect class="p4" x="162" width="46" height="4" rx="2" fill="#ff9a5c"/>
  </g>

  <!-- tag chips -->
  <g font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="14" font-weight="600">
    <g transform="translate(76 360)"><rect width="150" height="32" rx="16" fill="none" stroke="#3fb9a8" stroke-opacity=".7"/><text x="75" y="21" text-anchor="middle" fill="#3fb9a8">Systems Eng.</text></g>
    <g transform="translate(238 360)"><rect width="178" height="32" rx="16" fill="none" stroke="#5b8cff" stroke-opacity=".7"/><text x="89" y="21" text-anchor="middle" fill="#8ec5ff">Defensive Security</text></g>
    <g transform="translate(428 360)"><rect width="120" height="32" rx="16" fill="none" stroke="#a97cff" stroke-opacity=".7"/><text x="60" y="21" text-anchor="middle" fill="#c4adff">Applied AI</text></g>
  </g>
</g>
<rect x=".75" y=".75" width="1278.5" height="438.5" rx="25.5" fill="none" stroke="url(#bd)" stroke-width="1.5" stroke-opacity=".9"/>
</svg>
