<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img">
  <title>Atia Sanjida - System Specifications &amp; Profile</title>
  <defs>
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39d353">
        <animate attributeName="stop-color" values="#39d353;#58a6ff;#bc8cff;#39d353" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#39d353;#58a6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#39d353;#58a6ff;#bc8cff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Sci-Fi HUD Glow Filters -->
    <filter id="hudGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonPillGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="shieldRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#00f0ff"/>
      <stop offset="60%" stop-color="#0077ff"/>
      <stop offset="100%" stop-color="#003399"/>
    </linearGradient>

    <linearGradient id="leftFacetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2d58"/>
      <stop offset="45%" stop-color="#061d3f"/>
      <stop offset="100%" stop-color="#020d20"/>
    </linearGradient>

    <linearGradient id="rightFacetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04142d"/>
      <stop offset="60%" stop-color="#020a1a"/>
      <stop offset="100%" stop-color="#01050e"/>
    </linearGradient>

    <linearGradient id="lock3DBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="30%" stop-color="#0099ff"/>
      <stop offset="75%" stop-color="#0055dd"/>
      <stop offset="100%" stop-color="#002b88"/>
    </linearGradient>

    <linearGradient id="lockGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#99f0ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>

    <filter id="lockGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="arcGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>

    <linearGradient id="arcGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#0077ff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#00ff88" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyber Binary Pattern -->
    <pattern id="sysBinary" width="340" height="96" patternUnits="userSpaceOnUse">
      <text x="10" y="20" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#39d353" fill-opacity="0.07" letter-spacing="3">01001001 01000011 01000101 00100000</text>
      <text x="45" y="44" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#58a6ff" fill-opacity="0.06" letter-spacing="3">01010011 01000101 01000011 01010101</text>
      <text x="15" y="68" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#39d353" fill-opacity="0.06" letter-spacing="3">01010011 01011001 01010011 01010100</text>
      <text x="50" y="92" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#bc8cff" fill-opacity="0.05" letter-spacing="3">01001100 01001110 01011000 00100000</text>
    </pattern>

    <!-- Tactical Grid Lines -->
    <pattern id="sysGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58a6ff" stroke-width="0.7" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="1000" height="340" rx="16" fill="url(#sysBg)"/>
  <rect width="1000" height="340" rx="16" fill="url(#sysGrid)"/>
  <rect width="1000" height="340" rx="16" fill="url(#sysBinary)"/>
  <rect x="1" y="1" width="998" height="338" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Bar -->
  <rect x="1" y="1" width="998" height="36" rx="15" fill="#111622" fill-opacity="0.95"/>
  <rect x="1" y="20" width="998" height="17" fill="#111622" fill-opacity="0.95"/>
  <line x1="1" y1="37" x2="999" y2="37" stroke="#30363d" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="24" cy="18" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="5.5" fill="#27c93f"/>

  <!-- Session Title -->
  <text x="500" y="23" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle">
    atia@ice-station: ~ (fastfetch --profile overview)
  </text>

  <!-- Top Right Status -->
  <circle cx="906" cy="18" r="4" fill="#39d353">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="918" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#7ee787">
    ONLINE
  </text>

  <!-- Left Column: Futuristic Cyber Security HUD Card -->
  <g transform="translate(24, 52)">
    <rect width="248" height="265" rx="14" fill="#070b16" fill-opacity="0.9" stroke="#1f293d" stroke-width="1.2"/>
    
    <!-- Cyber Security Radar / Arc Reactor Dial with 3D Beveled Padlock Security Shield -->
    <g transform="translate(124, 82)">
      <!-- Background Radial Core Bloom -->
      <circle cx="0" cy="0" r="72" fill="url(#coreGlow)"/>

      <!-- Outer Fine Tech Ring -->
      <circle cx="0" cy="0" r="65" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.4"/>

      <!-- 16 Radar Dial Notch Ticks around perimeter -->
      <g stroke="#00f0ff" stroke-width="1.2" opacity="0.65">
        <!-- 4 Cardinal Crosshairs -->
        <line x1="0" y1="-69" x2="0" y2="-60" stroke-width="2.2" opacity="0.95"/>
        <line x1="0" y1="60" x2="0" y2="69" stroke-width="2.2" opacity="0.95"/>
        <line x1="-69" y1="0" x2="-60" y2="0" stroke-width="2.2" opacity="0.95"/>
        <line x1="60" y1="0" x2="69" y2="0" stroke-width="2.2" opacity="0.95"/>
        <!-- 4 Diagonals -->
        <line x1="-46" y1="-46" x2="-40" y2="-40" stroke-width="1.6"/>
        <line x1="40" y1="-40" x2="46" y2="-46" stroke-width="1.6"/>
        <line x1="-46" y1="46" x2="-40" y2="40" stroke-width="1.6"/>
        <line x1="40" y1="40" x2="46" y2="46" stroke-width="1.6"/>
        <!-- Fine intermediate ticks -->
        <line x1="-24" y1="-60" x2="-21" y2="-54"/>
        <line x1="21" y1="-54" x2="24" y2="-60"/>
        <line x1="-60" y1="-24" x2="-54" y2="-21"/>
        <line x1="54" y1="-21" x2="60" y2="-24"/>
        <line x1="-24" y1="60" x2="-21" y2="54"/>
        <line x1="21" y1="54" x2="24" y2="60"/>
        <line x1="-60" y1="24" x2="-54" y2="21"/>
        <line x1="54" y1="21" x2="60" y2="24"/>
      </g>

      <!-- Segmented Digital Rotating Ring (Counter-Clockwise) -->
      <circle cx="0" cy="0" r="57" fill="none" stroke="#00d4ff" stroke-width="2.2" stroke-dasharray="2, 6, 4, 6, 1.5, 7" opacity="0.75">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
      </circle>

      <!-- Main Heavy Glowing Arc Segments (Clockwise Rotation) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <!-- Arc 1: Neon Cyan Top-Right (20 to 140 deg) -->
        <path d="M 16.5 -45.5 A 48 48 0 0 1 31.0 37.0" fill="none" stroke="url(#arcGrad1)" stroke-width="4.2" stroke-linecap="round" filter="url(#hudGlow)"/>
        <!-- Arc 2: Neon Teal Bottom-Left (165 to 260 deg) -->
        <path d="M 12.0 46.5 A 48 48 0 0 1 -47.0 9.0" fill="none" stroke="url(#arcGrad2)" stroke-width="3.8" stroke-linecap="round" filter="url(#hudGlow)"/>
        <!-- Arc 3: Neon Cyan-Blue Upper-Left (285 to 345 deg) -->
        <path d="M -46.5 -12.5 A 48 48 0 0 1 -12.5 -46.5" fill="none" stroke="#00f0ff" stroke-width="3.2" stroke-linecap="round"/>
        
        <!-- Tech data nodes on perimeter -->
        <circle cx="31.0" cy="37.0" r="2.4" fill="#ffffff"/>
        <circle cx="-47.0" cy="9.0" r="2.4" fill="#00ffc4"/>
        <circle cx="-12.5" cy="-46.5" r="2.0" fill="#00f0ff"/>
      </g>

      <!-- Inner Tech Counter-Rotating Ring -->
      <circle cx="0" cy="0" r="38" fill="none" stroke="#00f0ff" stroke-width="1.3" stroke-dasharray="14, 5, 3, 5" opacity="0.65">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="14s" repeatCount="indefinite"/>
      </circle>

      <!-- ================= 3D BEVELED CYBER SECURITY SHIELD ================= -->
      <g filter="url(#hudGlow)">
        <!-- Outer Shield 3D Frame -->
        <path d="M 0 -38 C 10 -41 24 -39 31 -30 C 35 -10 36 12 26 28 C 17 38 0 46 0 46 C 0 46 -17 38 -26 28 C -36 12 -35 -10 -31 -30 C -24 -39 -10 -41 0 -38 Z"
              fill="#030c1d"
              stroke="url(#shieldRimGrad)"
              stroke-width="3.2"
              stroke-linejoin="round"/>

        <!-- Left 3D Facet (Light Source from Top-Left) -->
        <path d="M 0 -37 C -9 -40 -22 -38 -29 -29 C -33 -10 -32 11 -24 26 C -16 35 0 43 0 43 Z"
              fill="url(#leftFacetGrad)"/>

        <!-- Right 3D Facet (Shadow Side) -->
        <path d="M 0 -37 C 9 -40 22 -38 29 -29 C 33 -10 32 11 24 26 C 16 35 0 43 0 43 Z"
              fill="url(#rightFacetGrad)"/>

        <!-- Center 3D Facet Crease -->
        <line x1="0" y1="-37" x2="0" y2="44" stroke="#00f0ff" stroke-width="1" opacity="0.55"/>

        <!-- Top Crest Specular Highlight Line -->
        <path d="M -28 -28 C -20 -37 -8 -39 0 -37 C 8 -39 20 -37 28 -28"
              fill="none"
              stroke="#ffffff"
              stroke-width="1.6"
              stroke-linecap="round"
              opacity="0.95"/>

        <!-- Inner Tech Contour Outline -->
        <path d="M 0 -33 C 8 -35 19 -34 25 -26 C 28 -8 28 10 20 22 C 12 30 0 38 0 38 C 0 38 -12 30 -20 22 C -28 10 -28 -8 -25 -26 C -19 -34 -8 -35 0 -33 Z"
              fill="none"
              stroke="#00f0ff"
              stroke-width="0.8"
              opacity="0.5"/>

        <!-- ================= 3D GLOWING CYBER PADLOCK ================= -->
        <g transform="translate(0, 3)" filter="url(#lockGlow)">
          <!-- Outer Hollow Depth Shadow for Shackle -->
          <path d="M -9.5 -2 L -9.5 -11 C -9.5 -18 9.5 -18 9.5 -11 L 9.5 -2"
                fill="none"
                stroke="#020914"
                stroke-width="5.5"
                stroke-linecap="round"/>

          <!-- Main Metallic Shackle Arch -->
          <path d="M -9.5 -2 L -9.5 -11 C -9.5 -18 9.5 -18 9.5 -11 L 9.5 -2"
                fill="none"
                stroke="url(#shackleGrad)"
                stroke-width="3.8"
                stroke-linecap="round"/>

          <!-- Specular Highlight on Shackle Top -->
          <path d="M -5 -16 C -2 -18 2 -18 5 -16"
                fill="none"
                stroke="#ffffff"
                stroke-width="1.8"
                stroke-linecap="round"/>

          <!-- Padlock 3D Body -->
          <!-- Drop Shadow Under Lock Body -->
          <rect x="-16.5" y="-1.5" width="33" height="25" rx="5"
                fill="#010610"
                opacity="0.85"/>

          <!-- Main 3D Lock Body -->
          <rect x="-16" y="-2" width="32" height="24" rx="4.5"
                fill="url(#lock3DBase)"
                stroke="#00f0ff"
                stroke-width="1.4"/>

          <!-- Upper Gloss Highlight Sheen -->
          <rect x="-14.5" y="-1" width="29" height="10" rx="3.5"
                fill="url(#lockGloss)"/>

          <!-- Modern Cyber Keyhole -->
          <circle cx="0" cy="8" r="3.2" fill="#010915" stroke="#00f0ff" stroke-width="0.7"/>
          <path d="M -1.8 8 L 1.8 8 L 2.4 15 L -2.4 15 Z" fill="#010915" stroke="#00f0ff" stroke-width="0.7"/>
          <!-- Central Glowing Cyan LED / Core -->
          <circle cx="0" cy="8" r="1.4" fill="#00f0ff">
            <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
          </circle>
          <line x1="0" y1="9.5" x2="0" y2="13.5" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- Researcher Name & Degree (Exactly styled like user reference) -->
    <text x="124" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">
      ATIA SANJIDA (OISHI)
    </text>
    <text x="124" y="186" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600" fill="#00f0ff" text-anchor="middle" letter-spacing="0.5">
      B.Sc. in ICE, UNDERGRAD
    </text>

    <!-- Neon Glowing Active Pill (Exactly matching reference image) -->
    <g transform="translate(34, 206)">
      <rect width="180" height="28" rx="14" fill="#021c13" fill-opacity="0.95" stroke="#00ff66" stroke-width="1.8" filter="url(#neonPillGlow)"/>
      <circle cx="22" cy="14" r="4.5" fill="#00ff66">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="18" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#00ff66" letter-spacing="0.8">ACTIVE ON GITHUB</text>
    </g>
  </g>

  <!-- Right Column: Fastfetch Specs -->
  <g transform="translate(295, 52)">
    <!-- Command Prompt -->
    <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="500">
      <tspan fill="#39d353" font-weight="700">atia@ice-station</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff" font-weight="700">~</tspan><tspan fill="#8b949e">$</tspan> <tspan fill="#e6edf3" font-weight="600">fastfetch --profile overview</tspan>
    </text>

    <line x1="0" y1="26" x2="675" y2="26" stroke="#30363d" stroke-width="1"/>

    <!-- Combined Comprehensive Spec Rows -->
    <g transform="translate(0, 48)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#79c0ff">Academics   :</text>
      <text x="135" y="0" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#39d353">B.Sc. in Information &amp; Communication Eng. (ICE)</text>

      <text x="0" y="21" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#79c0ff">Workstation :</text>
      <text x="135" y="21" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" fill="#e6edf3">Linux Workstation (x86_64, Kali Linux &amp; Ubuntu LTS, Fedora ) </text>

      <text x="0" y="42" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#79c0ff">Core Track  :</text>
      <text x="135" y="42" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#58a6ff">Systems Engineering &amp; Defensive Security Research</text>

      <text x="0" y="63" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#79c0ff">Security Lab:</text>
      <text x="135" y="63" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" fill="#ff7b72">Vulnerability Analysis, Ethical Hacking &amp; OS Internals</text>

      <text x="0" y="84" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#79c0ff">Applied AI  :</text>
      <text x="135" y="84" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" fill="#d2a8ff">Agentic AI Workflows &amp; Real-Time Computer Vision (YOLOv8)</text>

      <text x="0" y="105" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#79c0ff">Engineering tools :</text>
      <text x="135" y="105" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" fill="#e6edf3">2D/3D Simulation - CST Studio, MATLAB, Auto CAD , Unreal Engine 5  </text>

      <text x="0" y="126" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#79c0ff">Methodology :</text>
      <text x="135" y="126" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" fill="#f0883e">First Principles — "Dissecting systems from memory layout to logic"</text>

      <text x="0" y="147" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#79c0ff">Profile Mode:</text>
      <text x="135" y="147" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#7ee787">Independent Systems Engineering Learner &amp; Security Researcher</text>
    </g>

    <!-- Color Palette Blocks & Blinking Cursor -->
    <g transform="translate(0, 224)">
      <rect x="0" y="0" width="20" height="11" rx="2.5" fill="#ff5f56"/>
      <rect x="26" y="0" width="20" height="11" rx="2.5" fill="#ffbd2e"/>
      <rect x="52" y="0" width="20" height="11" rx="2.5" fill="#27c93f"/>
      <rect x="78" y="0" width="20" height="11" rx="2.5" fill="#58a6ff"/>
      <rect x="104" y="0" width="20" height="11" rx="2.5" fill="#bc8cff"/>
      <rect x="130" y="0" width="20" height="11" rx="2.5" fill="#39d353"/>
      <rect x="156" y="0" width="20" height="11" rx="2.5" fill="#e6edf3"/>
      
      <!-- Blinking Terminal Prompt Cursor -->
      <rect x="190" y="-2" width="8" height="15" fill="#39d353" rx="1">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
