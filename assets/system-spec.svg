<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img">
  <title>Atia Sanjida - System Specifications &amp; Profile</title>
  <defs>
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39d353">
        <animate attributeName="stop-color" values="#39d353;#58a6ff;#bc8cff;#39d353" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#39d353;#58a6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#39d353;#58a6ff;#bc8cff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Sci-Fi HUD Glow Filters -->
    <filter id="hudGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonPillGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#2979ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>

    <linearGradient id="arcGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>

    <linearGradient id="arcGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#0077ff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#00ff88" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyber Binary Pattern -->
    <pattern id="sysBinary" width="340" height="96" patternUnits="userSpaceOnUse">
      <text x="10" y="20" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#39d353" fill-opacity="0.07" letter-spacing="3">01001001 01000011 01000101 00100000</text>
      <text x="45" y="44" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#58a6ff" fill-opacity="0.06" letter-spacing="3">01010011 01000101 01000011 01010101</text>
      <text x="15" y="68" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#39d353" fill-opacity="0.06" letter-spacing="3">01010011 01011001 01010011 01010100</text>
      <text x="50" y="92" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#bc8cff" fill-opacity="0.05" letter-spacing="3">01001100 01001110 01011000 00100000</text>
    </pattern>

    <!-- Tactical Grid Lines -->
    <pattern id="sysGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58a6ff" stroke-width="0.7" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="1000" height="340" rx="16" fill="url(#sysBg)"/>
  <rect width="1000" height="340" rx="16" fill="url(#sysGrid)"/>
  <rect width="1000" height="340" rx="16" fill="url(#sysBinary)"/>
  <rect x="1" y="1" width="998" height="338" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Bar -->
  <rect x="1" y="1" width="998" height="36" rx="15" fill="#111622" fill-opacity="0.95"/>
  <rect x="1" y="20" width="998" height="17" fill="#111622" fill-opacity="0.95"/>
  <line x1="1" y1="37" x2="999" y2="37" stroke="#30363d" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="24" cy="18" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="5.5" fill="#27c93f"/>

  <!-- Session Title -->
  <text x="500" y="23" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle">
    atia@ice-station: ~ (fastfetch --profile overview)
  </text>

  <!-- Top Right Status -->
  <circle cx="906" cy="18" r="4" fill="#39d353">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="918" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#7ee787">
    ONLINE
  </text>

  <!-- Left Column: Futuristic Cyber Security HUD Card -->
  <g transform="translate(24, 52)">
    <rect width="248" height="265" rx="14" fill="#070b16" fill-opacity="0.9" stroke="#1f293d" stroke-width="1.2"/>
    
    <!-- Cyber Security Radar / Arc Reactor Dial -->
    <g transform="translate(124, 82)">
      <!-- Background Radial Core Glow -->
      <circle cx="0" cy="0" r="68" fill="url(#coreGlow)"/>

      <!-- Outer Fine Tech Ring -->
      <circle cx="0" cy="0" r="62" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.35"/>
      <!-- Quadrant Ticks -->
      <line x1="0" y1="-66" x2="0" y2="-58" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
      <line x1="0" y1="58" x2="0" y2="66" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
      <line x1="-66" y1="0" x2="-58" y2="0" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
      <line x1="58" y1="0" x2="66" y2="0" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>

      <!-- Middle Segmented Rotating Teeth Ring -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="#00d4ff" stroke-width="2.2" stroke-dasharray="2, 6" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
      </circle>

      <!-- Main Heavy Glowing Arc Segments (Clockwise Rotation) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
        <!-- Arc 1: Neon Cyan Top-Right (20 to 140 deg) -->
        <path d="M 14.71 -40.42 A 43 43 0 0 1 27.64 32.94" fill="none" stroke="url(#arcGrad1)" stroke-width="4.5" stroke-linecap="round" filter="url(#hudGlow)"/>
        <!-- Arc 2: Neon Green Bottom-Right (160 to 260 deg) -->
        <path d="M 14.71 40.42 A 43 43 0 0 1 -42.35 7.47" fill="none" stroke="url(#arcGrad2)" stroke-width="4" stroke-linecap="round" filter="url(#hudGlow)"/>
        <!-- Arc 3: Neon Cyan-Blue Left (285 to 350 deg) -->
        <path d="M -41.53 -11.13 A 43 43 0 0 1 -7.47 -42.35" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Tech data dots on perimeter -->
        <circle cx="27.64" cy="32.94" r="2.2" fill="#ffffff"/>
        <circle cx="-42.35" cy="7.47" r="2.2" fill="#00ff88"/>
      </g>

      <!-- Inner Tech Counter-Rotating Ring -->
      <circle cx="0" cy="0" r="33" fill="none" stroke="#00f0ff" stroke-width="1.4" stroke-dasharray="12, 6, 3, 6" opacity="0.75">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="12s" repeatCount="indefinite"/>
      </circle>

      <!-- Central Holographic Cyber Shield -->
      <g filter="url(#hudGlow)">
        <!-- Shield Body -->
        <path d="M 0 -20 L 16 -13 L 16 3 C 16 14 0 23 0 23 C 0 23 -16 14 -16 3 L -16 -13 Z" fill="#051124" fill-opacity="0.95" stroke="url(#shieldGrad)" stroke-width="2.6" stroke-linejoin="round"/>
        <!-- Inner accent outline -->
        <path d="M 0 -17 L 13 -11 L 13 2 C 13 11 0 19 0 19 C 0 19 -13 11 -13 2 L -13 -11 Z" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.4"/>
        <!-- Center Glowing Checkmark -->
        <path d="M -5 1 L -1 5 L 6 -3" fill="none" stroke="#00ff88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Researcher Name & Degree (Exactly styled like user reference) -->
    <text x="124" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">
      ATIA SANJIDA (OISHI)
    </text>
    <text x="124" y="186" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600" fill="#00f0ff" text-anchor="middle" letter-spacing="0.5">
      B.Sc. in ICE, UNDERGRAD
    </text>

    <!-- Neon Glowing Active Pill (Exactly matching reference image) -->
    <g transform="translate(34, 206)">
      <rect width="180" height="28" rx="14" fill="#021c13" fill-opacity="0.95" stroke="#00ff66" stroke-width="1.8" filter="url(#neonPillGlow)"/>
      <circle cx="22" cy="14" r="4.5" fill="#00ff66">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="18" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#00ff66" letter-spacing="0.8">ACTIVE ON GITHUB</text>
    </g>
  </g>

  <!-- Right Column: Fastfetch Specs -->
  <g transform="translate(295, 52)">
    <!-- Command Prompt -->
    <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="500">
      <tspan fill="#39d353" font-weight="700">atia@ice-station</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff" font-weight="700">~</tspan><tspan fill="#8b949e">$</tspan> <tspan fill="#e6edf3" font-weight="600">fastfetch --profile overview</tspan>
    </text>

    <line x1="0" y1="26" x2="675" y2="26" stroke="#30363d" stroke-width="1"/>

    <!-- Short, Punchy Spec Rows -->
    <g transform="translate(0, 48)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#79c0ff">Academics    :</text>
      <text x="145" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#39d353">B.Sc. in Information &amp; Communication Eng. (ICE)</text>

      <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#79c0ff">Workstation  :</text>
      <text x="145" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#e6edf3">Kali Linux &amp; Ubuntu LTS (x86_64, Kernel 6.8)</text>

      <text x="0" y="44" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#79c0ff">Shell &amp; Env  :</text>
      <text x="145" y="44" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#e6edf3">zsh 5.9 + tmux (Multi-pane Workstation Session)</text>

      <text x="0" y="66" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#79c0ff">Core Track   :</text>
      <text x="145" y="66" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#58a6ff">Systems Engineering &amp; Defensive Security</text>

      <text x="0" y="88" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#79c0ff">Security Lab :</text>
      <text x="145" y="88" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#ff7b72">Vulnerability Analysis • OS Internals • OWASP Labs</text>

      <text x="0" y="110" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#79c0ff">Active AI    :</text>
      <text x="145" y="110" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#d2a8ff">Agentic AI Workflows • Computer Vision Models</text>

      <text x="0" y="132" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#79c0ff">Engineering  :</text>
      <text x="145" y="132" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#e6edf3">3D Simulation (UE5) • Antenna RF Modeling (CST)</text>

      <text x="0" y="154" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#79c0ff">Rule         :</text>
      <text x="145" y="154" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#c9d1d9">"Understand systems from first principles"</text>
    </g>

    <!-- Color Palette Blocks & Blinking Cursor -->
    <g transform="translate(0, 235)">
      <rect x="0" y="0" width="20" height="11" rx="2.5" fill="#ff5f56"/>
      <rect x="26" y="0" width="20" height="11" rx="2.5" fill="#ffbd2e"/>
      <rect x="52" y="0" width="20" height="11" rx="2.5" fill="#27c93f"/>
      <rect x="78" y="0" width="20" height="11" rx="2.5" fill="#58a6ff"/>
      <rect x="104" y="0" width="20" height="11" rx="2.5" fill="#bc8cff"/>
      <rect x="130" y="0" width="20" height="11" rx="2.5" fill="#39d353"/>
      <rect x="156" y="0" width="20" height="11" rx="2.5" fill="#e6edf3"/>
      
      <!-- Blinking Terminal Prompt Cursor -->
      <rect x="190" y="-2" width="8" height="15" fill="#39d353" rx="1">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>