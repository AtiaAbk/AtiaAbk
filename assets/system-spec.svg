<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img">
  <title>Atia Sanjida - System Specifications &amp; Profile</title>
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#140f26"/>
    </linearGradient>
    
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#39d353"/>
    </linearGradient>

    <!-- Cyber Binary Matrix Pattern (Subtle Ethical Hacker Theme) -->
    <pattern id="sysBinary" width="340" height="96" patternUnits="userSpaceOnUse">
      <text x="10" y="20" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#39d353" fill-opacity="0.08" letter-spacing="3">01001001 01000011 01000101 00100000</text>
      <text x="45" y="44" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#58a6ff" fill-opacity="0.07" letter-spacing="3">01010011 01000101 01000011 01010101</text>
      <text x="15" y="68" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#39d353" fill-opacity="0.07" letter-spacing="3">01010011 01011001 01010011 01010100</text>
      <text x="50" y="92" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#bc8cff" fill-opacity="0.06" letter-spacing="3">01001100 01001110 01011000 00100000</text>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" rx="16" fill="url(#termBg)"/>
  <rect width="1000" height="360" rx="16" fill="url(#sysBinary)"/>
  <rect x="1" y="1" width="998" height="358" rx="15" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Terminal Top Bar -->
  <rect x="1" y="1" width="998" height="42" rx="15" fill="#161b22" fill-opacity="0.95"/>
  <rect x="1" y="26" width="998" height="16" fill="#161b22" fill-opacity="0.95"/>
  <line x1="1" y1="42" x2="999" y2="42" stroke="#30363d" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="26" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="21" r="6" fill="#27c93f"/>

  <text x="500" y="26" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle">
    atia@station: ~ (fastfetch)
  </text>

  <!-- Left Column: Graphic Monogram & Sys Badge -->
  <g transform="translate(40, 68)">
    <rect width="260" height="260" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    
    <!-- Radar / Shield graphic -->
    <circle cx="130" cy="95" r="55" fill="#161b22" stroke="url(#cyanBlue)" stroke-width="2"/>
    <circle cx="130" cy="95" r="38" fill="none" stroke="#58a6ff" stroke-dasharray="3,3" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 130 95" to="360 130 95" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="95" r="22" fill="#0d1117" stroke="#39d353" stroke-width="1.5"/>
    
    <!-- Shield Icon inside -->
    <path d="M130 80 L142 85 V97 C142 105 130 110 130 110 C130 110 118 105 118 97 V85 Z" fill="#58a6ff" fill-opacity="0.3" stroke="#58a6ff" stroke-width="1.8"/>
    <polyline points="125,95 129,99 136,91" fill="none" stroke="#39d353" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ID Tag -->
    <text x="130" y="175" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">
      ATIA SANJIDA (OISHI)
    </text>
    <text x="130" y="196" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#79c0ff" text-anchor="middle">
      B.SC. IN ICE UNDERGRAD
    </text>

    <!-- Status pill -->
    <rect x="52" y="215" width="156" height="26" rx="13" fill="#161b22" stroke="#39d353" stroke-width="1"/>
    <circle cx="68" cy="228" r="4" fill="#39d353">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="232" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#39d353">
      ACTIVE ON GITHUB
    </text>
  </g>

  <!-- Right Column: System Specification / Fastfetch Data -->
  <g transform="translate(330, 72)">
    <!-- Command Prompt -->
    <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="14.5" font-weight="700" fill="#39d353">$</text>
    <text x="18" y="16" font-family="'JetBrains Mono', monospace" font-size="14.5" font-weight="600" fill="#e6edf3">fastfetch --profile overview</text>

    <line x1="0" y1="28" x2="630" y2="28" stroke="#30363d" stroke-width="1"/>

    <!-- Neofetch rows with clean spacing -->
    <g transform="translate(0, 48)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#79c0ff">Academics:</text>
      <text x="155" y="0" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="600" fill="#39d353">B.Sc. in Information &amp; Communication Eng. (ICE)</text>

      <text x="0" y="23" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#79c0ff">Workstation:</text>
      <text x="155" y="23" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="500" fill="#e6edf3">Linux Workstation (x86_64, Kali Linux &amp; Ubuntu 24.04)</text>

      <text x="0" y="46" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#79c0ff">Low-Level &amp; OS:</text>
      <text x="155" y="46" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="500" fill="#e6edf3">C, C++ (Memory Internals, POSIX), Bash, Zsh, Tmux</text>

      <text x="0" y="69" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#79c0ff">High-Level Dev:</text>
      <text x="155" y="69" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="500" fill="#e6edf3">Python (Automation, Scikit, OpenCV), SQL, Java</text>

      <text x="0" y="92" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#79c0ff">Engineering Suite:</text>
      <text x="155" y="92" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="600" fill="#58a6ff">Unreal Engine 5, MATLAB, AutoCAD, CST Studio Suite</text>

      <text x="0" y="115" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#79c0ff">Security Tooling:</text>
      <text x="155" y="115" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="500" fill="#e6edf3">Wireshark, OWASP Top 10 Labs, Nmap, Burp Suite</text>

      <text x="0" y="138" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#79c0ff">Version Control:</text>
      <text x="155" y="138" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="500" fill="#e6edf3">Git Internals (DAGs, Objects, Plumbing Commands)</text>

      <text x="0" y="161" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#79c0ff">Telemetry &amp; Code:</text>
      <text x="155" y="161" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="500" fill="#bc8cff">70+ Repositories • VS Code • Linux CLI Environment</text>
    </g>

    <!-- Color Palette / Terminal Dots -->
    <g transform="translate(0, 248)">
      <rect x="0" y="0" width="22" height="12" rx="3" fill="#ff5f56"/>
      <rect x="28" y="0" width="22" height="12" rx="3" fill="#ffbd2e"/>
      <rect x="56" y="0" width="22" height="12" rx="3" fill="#27c93f"/>
      <rect x="84" y="0" width="22" height="12" rx="3" fill="#58a6ff"/>
      <rect x="112" y="0" width="22" height="12" rx="3" fill="#bc8cff"/>
      <rect x="140" y="0" width="22" height="12" rx="3" fill="#39d353"/>
      <rect x="168" y="0" width="22" height="12" rx="3" fill="#e6edf3"/>
      
      <!-- Blinking cursor -->
      <rect x="202" y="-2" width="9" height="16" fill="#58a6ff">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>