<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 235" width="1000" height="235" role="img">
  <title>Atia Sanjida - Research Log Terminal Session</title>
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39d353">
        <animate attributeName="stop-color" values="#39d353;#58a6ff;#bc8cff;#39d353" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#39d353;#58a6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#39d353;#58a6ff;#bc8cff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Cyber Binary Background Pattern -->
    <pattern id="binaryStream" width="340" height="96" patternUnits="userSpaceOnUse">
      <text x="10" y="20" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#39d353" fill-opacity="0.08" letter-spacing="3">01001001 01000011 01000101 00100000</text>
      <text x="45" y="44" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#58a6ff" fill-opacity="0.07" letter-spacing="3">01010011 01000101 01000011 01010101</text>
      <text x="15" y="68" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#39d353" fill-opacity="0.07" letter-spacing="3">01010011 01011001 01010011 01010100</text>
      <text x="50" y="92" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#bc8cff" fill-opacity="0.06" letter-spacing="3">01001100 01001110 01011000 00100000</text>
    </pattern>

    <!-- Tactical Grid Lines -->
    <pattern id="termGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58a6ff" stroke-width="0.7" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <style>
    .t-line {
      animation: printLine 0.4s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    .t-l1 { animation-delay: 0.1s; }
    .t-l2 { animation-delay: 0.3s; }
    .t-l3 { animation-delay: 0.5s; }
    .t-l4 { animation-delay: 0.7s; }
    .t-l5 { animation-delay: 0.9s; }
    .t-l6 { animation-delay: 1.1s; }
    .t-l7 { animation-delay: 1.3s; }

    @keyframes printLine {
      0%   { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>

  <!-- Terminal Body Background -->
  <rect width="1000" height="235" rx="14" fill="url(#termBg)"/>
  <rect width="1000" height="235" rx="14" fill="url(#termGrid)"/>
  <rect width="1000" height="235" rx="14" fill="url(#binaryStream)"/>
  <rect x="1" y="1" width="998" height="233" rx="13" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Terminal Top Bar -->
  <rect x="1" y="1" width="998" height="34" rx="13" fill="#111622" fill-opacity="0.95"/>
  <rect x="1" y="20" width="998" height="15" fill="#111622" fill-opacity="0.95"/>
  <line x1="1" y1="35" x2="999" y2="35" stroke="#30363d" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="24" cy="18" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="5.5" fill="#27c93f"/>

  <!-- Centered Session Title -->
  <text x="500" y="22" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle">
    atia@ice-station: ~/scripts/research-log.sh — zsh
  </text>

  <!-- Right status pill -->
  <circle cx="896" cy="18" r="4" fill="#39d353">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="908" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#7ee787">
    EXEC: 0.04s
  </text>

  <!-- Terminal Execution Content -->
  <g transform="translate(30, 0)">
    <!-- Command Invocation -->
    <g class="t-line t-l1">
      <text x="0" y="60" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13" font-weight="500">
        <tspan fill="#39d353" font-weight="700">atia@ice-station</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff" font-weight="700">~/scripts</tspan><tspan fill="#8b949e">$</tspan> <tspan fill="#e6edf3" font-weight="600">./research-log.sh --status</tspan>
      </text>
    </g>

    <!-- Output Row 1: First Principles Method -->
    <g class="t-line t-l2">
      <text x="0" y="84" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12.5" font-weight="500">
        <tspan fill="#f0883e" font-weight="700">[METHOD] </tspan> <tspan fill="#79c0ff" font-weight="600">First Principles</tspan> <tspan fill="#8b949e">:</tspan> <tspan fill="#c9d1d9">"Dissecting systems from memory layout and network packets to logic."</tspan>
      </text>
    </g>

    <!-- Output Row 2: Cybersecurity Domain -->
    <g class="t-line t-l3">
      <text x="0" y="108" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12.5" font-weight="500">
        <tspan fill="#ff7b72" font-weight="700">[DOMAIN] </tspan> <tspan fill="#ff7b72" font-weight="600">Cybersecurity   </tspan> <tspan fill="#8b949e">:</tspan> <tspan fill="#e6edf3">Vulnerability analysis, ethical hacking methodologies &amp; defensive mitigation</tspan>
      </text>
    </g>

    <!-- Output Row 3: Systems Research Study -->
    <g class="t-line t-l4">
      <text x="0" y="132" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12.5" font-weight="500">
        <tspan fill="#58a6ff" font-weight="700">[STUDY]  </tspan> <tspan fill="#58a6ff" font-weight="600">Systems Research</tspan> <tspan fill="#8b949e">:</tspan> <tspan fill="#e6edf3">Operating system internals, process memory spaces &amp; secure architectures</tspan>
      </text>
    </g>

    <!-- Output Row 4: AI & Autonomy Roadmap -->
    <g class="t-line t-l5">
      <text x="0" y="156" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12.5" font-weight="500">
        <tspan fill="#d2a8ff" font-weight="700">[ROADMAP]</tspan> <tspan fill="#d2a8ff" font-weight="600">AI &amp; Autonomy   </tspan> <tspan fill="#8b949e">:</tspan> <tspan fill="#e6edf3">Developing Agentic AI workflows &amp; applied real-time computer vision models</tspan>
      </text>
    </g>

    <!-- Output Row 5: Profile Mode -->
    <g class="t-line t-l6">
      <text x="0" y="180" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12.5" font-weight="500">
        <tspan fill="#39d353" font-weight="700">[STATUS] </tspan> <tspan fill="#39d353" font-weight="600">Profile Mode    </tspan> <tspan fill="#8b949e">:</tspan> <tspan fill="#c9d1d9">Independent self-driven researcher &amp; systems engineering learner</tspan>
      </text>
    </g>

    <!-- Output Row 6: Ready Prompt with Blinking Cursor -->
    <g class="t-line t-l7">
      <text x="0" y="206" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13" font-weight="500">
        <tspan fill="#39d353" font-weight="700">atia@ice-station</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff" font-weight="700">~/scripts</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#39d353">█<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></tspan>
      </text>
    </g>
  </g>
</svg>
