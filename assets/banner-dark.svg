<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img">
  <title>Atia Sanjida (Oishi) - AI &amp; Cybersecurity Researcher</title>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#070d1e"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <!-- Neon Multi-Color Border Gradient with Animation -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#a855f7;#00ff88;#00f0ff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#00ff88;#00f0ff;#a855f7" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00ff88">
        <animate attributeName="stop-color" values="#00ff88;#00f0ff;#a855f7;#00ff88" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Name Electric Cyber Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#70a6ff"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#00ffb4"/>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.0" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.0" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Tactical Hexagonal / Circuit Pattern -->
    <pattern id="cyberGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#00f0ff" stroke-width="0.7" stroke-opacity="0.045"/>
      <circle cx="0" cy="0" r="1.2" fill="#00f0ff" fill-opacity="0.2"/>
    </pattern>

    <!-- Binary Code Stream Pattern -->
    <pattern id="binaryStream" width="280" height="80" patternUnits="userSpaceOnUse">
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00ff88" fill-opacity="0.04" letter-spacing="2">01000001 01001001 00100000 01010011</text>
      <text x="35" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00f0ff" fill-opacity="0.035" letter-spacing="2">01010011 01000101 01000011 01010101</text>
      <text x="15" y="66" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a855f7" fill-opacity="0.035" letter-spacing="2">01001001 01000011 01000101 00100000</text>
    </pattern>
  </defs>

  <!-- Banner Card Background -->
  <rect width="1000" height="290" rx="18" fill="url(#bgGrad)"/>
  <rect width="1000" height="290" rx="18" fill="url(#cyberGrid)"/>
  <rect width="1000" height="290" rx="18" fill="url(#binaryStream)"/>

  <!-- Outer Neon Glowing Frame -->
  <rect x="1" y="1" width="998" height="288" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.8"/>

  <!-- Corner Tactical HUD Brackets -->
  <g stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.75">
    <!-- Top-Left -->
    <path d="M 6 22 L 6 8 L 22 8"/>
    <!-- Top-Right -->
    <path d="M 978 8 L 994 8 L 994 22"/>
    <!-- Bottom-Left -->
    <path d="M 6 268 L 6 282 L 22 282"/>
    <!-- Bottom-Right -->
    <path d="M 978 282 L 994 282 L 994 268"/>
  </g>

  <!-- ================= LEFT: HOLOGRAPHIC AI & CYBER EMBLEM ================= -->
  <g transform="translate(98, 116)">
    <!-- Ambient Core Glow -->
    <circle cx="0" cy="0" r="54" fill="#00f0ff" fill-opacity="0.08"/>

    <!-- Outer Rotating Radar Compass Dial -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.35"/>
    <!-- Cardinal Compass Ticks -->
    <line x1="0" y1="-54" x2="0" y2="-46" stroke="#00f0ff" stroke-width="1.8" opacity="0.8"/>
    <line x1="0" y1="46" x2="0" y2="54" stroke="#00f0ff" stroke-width="1.8" opacity="0.8"/>
    <line x1="-54" y1="0" x2="-46" y2="0" stroke="#00f0ff" stroke-width="1.8" opacity="0.8"/>
    <line x1="46" y1="0" x2="54" y2="0" stroke="#00f0ff" stroke-width="1.8" opacity="0.8"/>

    <!-- Counter-Rotating Segmented Digital Tech Ring -->
    <circle cx="0" cy="0" r="43" fill="none" stroke="#00d4ff" stroke-width="1.8" stroke-dasharray="2, 5, 4, 5, 1.5, 6" opacity="0.65">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
    </circle>

    <!-- Clockwise Heavy Glowing Arc Segments -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
      <path d="M 12 -33 A 35 35 0 0 1 24 26" fill="none" stroke="#00f0ff" stroke-width="3.2" stroke-linecap="round" filter="url(#neonGlow)"/>
      <path d="M 9 34 A 35 35 0 0 1 -34 7" fill="none" stroke="#00ff88" stroke-width="2.8" stroke-linecap="round" filter="url(#neonGlow)"/>
      <circle cx="24" cy="26" r="2" fill="#ffffff"/>
      <circle cx="-34" cy="7" r="2" fill="#00ff88"/>
    </g>

    <!-- Central Cyber Hexagonal Shield Frame -->
    <polygon points="31.2,-18.0 31.2,18.0 0.0,36.0 -31.2,18.0 -31.2,-18.0 0.0,-36.0" 
             fill="#040a18" 
             fill-opacity="0.95"
             stroke="#00f0ff" 
             stroke-width="2.2" 
             stroke-linejoin="round"
             filter="url(#neonGlow)"/>

    <!-- Inner Hexagonal Border -->
    <polygon points="26,-15 26,15 0,30 -26,15 -26,-15 0,-30" 
             fill="none" 
             stroke="#a855f7" 
             stroke-width="1.2" 
             stroke-opacity="0.6"/>

    <!-- AI Neural Core Synapse & Security Padlock Core -->
    <!-- Neural Synapse Data Vectors -->
    <g stroke="#00f0ff" stroke-width="1.2" opacity="0.75">
      <line x1="0" y1="0" x2="-14" y2="-12"/>
      <line x1="0" y1="0" x2="14" y2="-12"/>
      <line x1="0" y1="0" x2="-16" y2="10"/>
      <line x1="0" y1="0" x2="16" y2="10"/>
      <line x1="0" y1="0" x2="0" y2="-18"/>
      <line x1="0" y1="0" x2="0" y2="18"/>
    </g>

    <!-- Neural Nodes -->
    <circle cx="-14" cy="-12" r="2.4" fill="#a855f7" filter="url(#badgeGlow)"/>
    <circle cx="14" cy="-12" r="2.4" fill="#00f0ff" filter="url(#badgeGlow)"/>
    <circle cx="-16" cy="10" r="2.4" fill="#00ff88" filter="url(#badgeGlow)"/>
    <circle cx="16" cy="10" r="2.4" fill="#00f0ff" filter="url(#badgeGlow)"/>
    <circle cx="0" cy="-18" r="2.0" fill="#ffffff"/>
    <circle cx="0" cy="18" r="2.0" fill="#a855f7"/>

    <!-- Glowing Cyber Center Pulse (AI Core) -->
    <circle cx="0" cy="0" r="6.5" fill="#00f0ff" filter="url(#neonGlow)">
      <animate attributeName="r" values="6.5;8;6.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3.2" fill="#ffffff"/>

    <!-- Emblem Subtitle -->
    <text x="0" y="66" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#00f0ff" text-anchor="middle" letter-spacing="1.5">
      AI • SECURITY
    </text>
  </g>

  <!-- ================= CENTER: RESEARCHER IDENTITY & BADGES ================= -->
  <g transform="translate(182, 46)">
    <!-- Top System Beacon Tag -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="3.5" fill="#00ff88">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="16" y="8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="700" fill="#00ff88" letter-spacing="1.2">
        SYSTEM AUTHENTICATED // RESEARCHER PROFILE
      </text>
    </g>

    <!-- Main Name with Electric Gradient -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="800" fill="url(#nameGrad)" letter-spacing="0.5">
      Atia Sanjida (Oishi)
      <tspan font-size="26"> 🛡️</tspan>
    </text>

    <!-- Holographic Specialization Pills Cluster -->
    <g transform="translate(0, 64)">
      <!-- Pill 1: Cybersecurity -->
      <g transform="translate(0, 0)">
        <rect width="220" height="25" rx="6" fill="#051829" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.85"/>
        <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.3">
          🛡️ <tspan fill="#58a6ff">Security Researcher</tspan> <tspan fill="#8b949e">•</tspan> <tspan fill="#c9d1d9">Cyber</tspan>
        </text>
      </g>

      <!-- Pill 2: AI / ML -->
      <g transform="translate(228, 0)">
        <rect width="218" height="25" rx="6" fill="#140c26" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.85"/>
        <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.3">
          🤖 <tspan fill="#d2a8ff">AI/ML &amp; Agentic Systems</tspan>
        </text>
      </g>
    </g>

    <!-- Second Line of Pills -->
    <g transform="translate(0, 96)">
      <!-- Pill 3: Systems & Networks -->
      <g transform="translate(0, 0)">
        <rect width="220" height="25" rx="6" fill="#061c16" stroke="#00ff88" stroke-width="1.2" stroke-opacity="0.85"/>
        <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.3">
          🐧 <tspan fill="#39d353">Systems &amp; Computer Networks</tspan>
        </text>
      </g>

      <!-- Pill 4: ICE Undergraduate -->
      <g transform="translate(228, 0)">
        <rect width="218" height="25" rx="6" fill="#1d1206" stroke="#f0883e" stroke-width="1.2" stroke-opacity="0.85"/>
        <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.3">
          🎓 <tspan fill="#ffa657">B.Sc. in ICE Undergrad</tspan>
        </text>
      </g>
    </g>

    <!-- Active Terminal Status Line -->
    <g transform="translate(0, 137)">
      <text font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="600">
        <tspan fill="#00f0ff" font-weight="700">&gt;</tspan>
        <tspan fill="#79c0ff"> exploring: </tspan>
        <tspan fill="#e6edf3">Offensive Security Labs, Python &amp; Vision Pipelines</tspan>
      </text>
    </g>
  </g>

  <!-- ================= RIGHT: HIGH-TECH CYBER TELEMETRY HUD ================= -->
  <g transform="translate(672, 44)">
    <!-- HUD Console Glassmorphic Box -->
    <rect width="284" height="152" rx="12" fill="#060b17" fill-opacity="0.95" stroke="#1f2c42" stroke-width="1.2"/>

    <!-- Top Window Title Bar -->
    <g transform="translate(12, 16)">
      <circle cx="0" cy="0" r="3.5" fill="#ff5f56"/>
      <circle cx="10" cy="0" r="3.5" fill="#ffbd2e"/>
      <circle cx="20" cy="0" r="3.5" fill="#27c93f"/>
      <text x="32" y="3.5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#79c0ff" letter-spacing="1">
        TELEMETRY &amp; LAB METRICS
      </text>
    </g>

    <!-- Divider Line -->
    <line x1="12" y1="28" x2="272" y2="28" stroke="#1f2c42" stroke-width="1"/>

    <!-- Telemetry Rows -->
    <g transform="translate(12, 45)" font-family="'JetBrains Mono', monospace" font-size="10.5">
      <!-- Row 1: AI Engine -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" font-weight="700" fill="#00f0ff">AI FOCUS</text>
        <text x="68" y="0" font-weight="600" fill="#58a6ff">:</text>
        <text x="80" y="0" font-weight="500" fill="#d2a8ff">YOLOv8 • Agentic AI</text>
      </g>
      <!-- Row 2: Vuln Lab -->
      <g transform="translate(0, 20)">
        <text x="0" y="0" font-weight="700" fill="#00ff88">SEC LAB </text>
        <text x="68" y="0" font-weight="600" fill="#58a6ff">:</text>
        <text x="80" y="0" font-weight="500" fill="#7ee787">OWASP • Wireshark</text>
      </g>
      <!-- Row 3: OS / Kernels -->
      <g transform="translate(0, 40)">
        <text x="0" y="0" font-weight="700" fill="#f0883e">ENV     </text>
        <text x="68" y="0" font-weight="600" fill="#58a6ff">:</text>
        <text x="80" y="0" font-weight="500" fill="#e6edf3">Kali • Ubuntu • Fedora</text>
      </g>
      <!-- Row 4: Tools -->
      <g transform="translate(0, 60)">
        <text x="0" y="0" font-weight="700" fill="#bc8cff">TOOLS   </text>
        <text x="68" y="0" font-weight="600" fill="#58a6ff">:</text>
        <text x="80" y="0" font-weight="500" fill="#79c0ff">CST • Unreal 5 • C++</text>
      </g>
    </g>

    <!-- Mini Real-Time Audio / RF Waveform at bottom of card -->
    <path d="M 14 136 L 40 136 L 50 125 L 58 143 L 68 128 L 78 138 L 86 136 L 150 136 L 158 127 L 166 142 L 174 133 L 182 136 L 270 136"
          fill="none"
          stroke="#00f0ff"
          stroke-width="1.3"
          stroke-linecap="round"
          opacity="0.8"
          filter="url(#badgeGlow)">
      <animate attributeName="stroke-dashoffset" values="0;200" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ================= BOTTOM: TACTICAL MISSION LOG ================= -->
  <g transform="translate(36, 218)">
    <rect width="928" height="42" rx="10" fill="#070c18" fill-opacity="0.95" stroke="#1f2c42" stroke-width="1.2"/>
    
    <!-- Left Beacon Pill -->
    <g transform="translate(14, 11)">
      <rect width="105" height="20" rx="5" fill="#051c2e" stroke="#00f0ff" stroke-width="0.9"/>
      <circle cx="10" cy="10" r="3" fill="#00ff88">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="18" y="14" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#00f0ff" letter-spacing="1">
        MISSION LOG
      </text>
    </g>

    <!-- Mission Statement Quote -->
    <text x="134" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#c9d1d9">
      "B.Sc. in Information &amp; Communication Engineering | exploring Systems, Security, and Agentic AI."
    </text>

    <!-- Right Live Status Tag -->
    <g transform="translate(820, 11)">
      <rect width="94" height="20" rx="5" fill="#041a12" stroke="#00ff88" stroke-width="0.9"/>
      <circle cx="10" cy="10" r="3" fill="#00ff88">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="19" y="14" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#00ff88" letter-spacing="0.5">
        STATION ON
      </text>
    </g>
  </g>

  <!-- Animated High-Energy Sweeping Laser Beam at bottom edge -->
  <rect x="0" y="286" width="220" height="3" rx="1.5" fill="url(#laserGrad)">
    <animate attributeName="x" values="0;780;0" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
