<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img">
  <title>Atia Sanjida (Oishi) - GitHub Profile Banner (Dark)</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#140d24"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#39d353;#58a6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#39d353;#58a6ff;#bc8cff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#39d353">
        <animate attributeName="stop-color" values="#39d353;#58a6ff;#bc8cff;#39d353" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="50%" stop-color="#d2a8ff"/>
      <stop offset="100%" stop-color="#56d364"/>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyber Binary Matrix Pattern (Subtle Ethical Hacker Theme) -->
    <pattern id="cyberBinary" width="340" height="96" patternUnits="userSpaceOnUse">
      <text x="10" y="20" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#39d353" fill-opacity="0.09" letter-spacing="3">01001001 01000011 01000101 00100000</text>
      <text x="45" y="44" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#58a6ff" fill-opacity="0.08" letter-spacing="3">01010011 01000101 01000011 01010101</text>
      <text x="15" y="68" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#39d353" fill-opacity="0.08" letter-spacing="3">01010011 01011001 01010011 01010100</text>
      <text x="50" y="92" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#bc8cff" fill-opacity="0.07" letter-spacing="3">01001100 01001110 01011000 00100000</text>
    </pattern>

    <!-- Tactical Cyber Grid Lines -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58a6ff" stroke-width="0.7" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <style>
    .role-1, .role-2, .role-3, .role-4 {
      opacity: 0;
      animation-duration: 20s;
      animation-iteration-count: infinite;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
    .role-1 { animation-name: role1; }
    .role-2 { animation-name: role2; }
    .role-3 { animation-name: role3; }
    .role-4 { animation-name: role4; }

    @keyframes role1 {
      0%        { opacity: 1; transform: translateY(0); }
      18%       { opacity: 1; transform: translateY(0); }
      22%       { opacity: 0; transform: translateY(-4px); }
      23%, 95%  { opacity: 0; transform: translateY(4px); }
      99%       { opacity: 0.8; transform: translateY(1px); }
      100%      { opacity: 1; transform: translateY(0); }
    }
    @keyframes role2 {
      0%, 22%   { opacity: 0; transform: translateY(4px); }
      26%       { opacity: 1; transform: translateY(0); }
      43%       { opacity: 1; transform: translateY(0); }
      47%       { opacity: 0; transform: translateY(-4px); }
      48%, 100% { opacity: 0; transform: translateY(4px); }
    }
    @keyframes role3 {
      0%, 47%   { opacity: 0; transform: translateY(4px); }
      51%       { opacity: 1; transform: translateY(0); }
      68%       { opacity: 1; transform: translateY(0); }
      72%       { opacity: 0; transform: translateY(-4px); }
      73%, 100% { opacity: 0; transform: translateY(4px); }
    }
    @keyframes role4 {
      0%, 72%   { opacity: 0; transform: translateY(4px); }
      76%       { opacity: 1; transform: translateY(0); }
      93%       { opacity: 1; transform: translateY(0); }
      97%       { opacity: 0; transform: translateY(-4px); }
      98%, 100% { opacity: 0; transform: translateY(4px); }
    }
  </style>

  <rect width="1000" height="290" rx="18" fill="url(#bgGrad)"/>
  <rect width="1000" height="290" rx="18" fill="url(#cyberGrid)"/>
  <rect width="1000" height="290" rx="18" fill="url(#cyberBinary)"/>

  <circle cx="150" cy="80" r="100" fill="#58a6ff" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="850" cy="200" r="110" fill="#bc8cff" opacity="0.12" filter="url(#softGlow)"/>

  <rect x="1" y="1" width="998" height="288" rx="17" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="1" y="1" width="998" height="38" rx="17" fill="#161b22" fill-opacity="0.8"/>
  <rect x="1" y="26" width="998" height="13" fill="#161b22" fill-opacity="0.8"/>
  <line x1="1" y1="39" x2="999" y2="39" stroke="#30363d" stroke-width="1"/>

  <circle cx="28" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="20" r="6" fill="#27c93f"/>

  <text x="500" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle">
    atia@ice-station: ~/systems-and-security (main)
  </text>

  <!-- Status Badge -->
  <g transform="translate(730, 10)">
    <rect width="245" height="22" rx="11" fill="#0d1117" stroke="#388bfd" stroke-width="1.2"/>
    <circle cx="14" cy="11" r="4.5" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#79c0ff" letter-spacing="0.5">B.SC. ICE • SYSTEMS &amp; SECURITY 🛡️</text>
  </g>

  <!-- Monogram Box -->
  <g transform="translate(48, 68)">
    <rect width="112" height="112" rx="24" fill="#161b22" stroke="url(#borderGrad)" stroke-width="2"/>
    <circle cx="56" cy="56" r="44" fill="#0d1117"/>
    <path d="M42 46 L30 56 L42 66" fill="none" stroke="#58a6ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70 46 L82 56 L70 66" fill="none" stroke="#bc8cff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="58" y1="44" x2="54" y2="68" stroke="#39d353" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- Name -->
  <g transform="translate(182, 92)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#79c0ff" letter-spacing="1">
      HI THERE, I'M
    </text>
    <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#textGrad)" letter-spacing="0.5">
      Atia Sanjida (Oishi)
    </text>
    <text x="350" y="34" font-size="28">👋</text>
  </g>

              <!-- Dynamic Cycling Roles -->
  <g transform="translate(182, 162)">
    <g class="role-1">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e6edf3">
        🛡️ <tspan fill="#58a6ff" font-weight="700">Security Researcher</tspan> <tspan fill="#8b949e">•</tspan> <tspan fill="#c9d1d9">Cybersecurity &amp; Ethical Hacking</tspan>
      </text>
    </g>
    <g class="role-2">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e6edf3">
        🐧 <tspan fill="#bc8cff" font-weight="700">Systems Engineering Learner</tspan>
      </text>
    </g>
    <g class="role-3">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e6edf3">
        🤖 <tspan fill="#39d353" font-weight="700">Currently Learning</tspan> <tspan fill="#8b949e">•</tspan> <tspan fill="#c9d1d9">AI/ML &amp; Agentic AI</tspan>
      </text>
    </g>
    <g class="role-4">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e6edf3">
        🎓 <tspan fill="#f0883e" font-weight="700">B.Sc. Student</tspan> <tspan fill="#8b949e">•</tspan> <tspan fill="#c9d1d9">Information &amp; Communication Engineering</tspan>
      </text>
    </g>
  </g>

  <!-- Tagline Quote -->
  <g transform="translate(48, 222)">
    <rect width="904" height="42" rx="10" fill="#161b22" fill-opacity="0.75" stroke="#30363d" stroke-width="1"/>
    <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e">
      🎓 <tspan fill="#c9d1d9" font-weight="500">"B.Sc. student in Information &amp; Communication Engineering — exploring Systems, Security, and Agentic AI."</tspan>
    </text>
  </g>

  <rect x="0" y="286" width="180" height="3" rx="1.5" fill="url(#laserGrad)">
    <animate attributeName="x" values="0;820;0" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
